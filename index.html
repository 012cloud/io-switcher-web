<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I/O 스위처</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I/O 스위처">
<meta name="theme-color" content="#8f95ec">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --grad-a: #a491ec;
    --grad-b: #6f9fe8;
    --body-top: #ffffff;
    --body-bottom: #f1f4fb;
    --ink: #4a4f66;
    --ink-soft: #8a8fa6;
    --pill-ring: #d9def0;
    --pill-edge: #b9c2e2;
    --pill-press: #e3e8f3;
    --err: #d0453b;
    --ok: #3e9e6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(var(--body-top), var(--body-bottom));
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .5; }
  svg { display: block; }

  /* ── 상단 ── */
  header {
    background: linear-gradient(200deg, var(--grad-b) 0%, var(--grad-a) 100%);
    color: #fff;
    padding: env(safe-area-inset-top) 16px 20px;
  }
  .topbar {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    height: 48px;
  }
  .topbar h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; }
  .device {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }
  .device-badge {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    display: grid; place-items: center;
    margin-bottom: 4px;
    position: relative;
  }
  .device-badge.busy::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .7); border-right-color: transparent;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #devName { font-size: 22px; font-weight: 500; }
  #devSub { font-size: 13px; opacity: .8; }

  /* ── 스위치 ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 40px);
    padding: 20px 16px 4px;
  }
  .pill {
    width: min(100%, 340px);
    height: 84px;
    border-radius: 42px;
    padding: 5px;
    background: var(--pill-ring);
    box-shadow: 0 6px 18px rgba(90, 104, 160, .12);
  }
  .pill-inner {
    height: 100%;
    border-radius: 37px;
    background: #fff;
    border: 2px solid var(--pill-edge);
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    align-items: center;
    overflow: hidden;
  }
  .pill-inner .divider { width: 1px; height: 46%; background: #dfe3ef; }
  .side {
    height: 100%;
    display: grid;
    place-items: center;
    transition: background .2s;
  }
  .side.off.active { background: linear-gradient(270deg, #fff 0%, var(--pill-press) 100%); }
  .side.on.active  { background: linear-gradient(90deg,  #fff 0%, var(--pill-press) 100%); }
  .side:active { background: var(--pill-press); }

  #toast {
    min-height: 1.4em;
    font-size: 14px;
    color: var(--ink-soft);
    text-align: center;
    padding: 0 16px;
    word-break: break-all;
  }
  #toast.err { color: var(--err); }
  #toast.ok { color: var(--ok); }

  /* ── 하단 ── */
  nav {
    display: flex;
    justify-content: space-around;
    padding: 8px 16px max(12px, env(safe-area-inset-bottom));
  }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: #6a6f86; min-width: 84px; }
  .nav-circle {
    width: 56px; height: 56px; border-radius: 50%;
    border: 1.5px solid #dde1ee;
    background: #fff;
    display: grid; place-items: center;
  }
  .nav-btn.on .nav-circle { border-color: var(--grad-a); background: #f1eefd; }

  /* ── 설정 시트 ── */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(30, 32, 50, .35);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 8px 20px max(24px, env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .25s;
    max-width: 520px; margin: 0 auto;
  }
  body.sheet-open .sheet-bg { opacity: 1; pointer-events: auto; }
  body.sheet-open .sheet { transform: none; }
  .grabber { width: 40px; height: 5px; border-radius: 3px; background: #dde1ee; margin: 4px auto 16px; }
  .sheet h2 { font-size: 18px; margin: 0 0 12px; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #eef0f6; }
  .field input[type=text] {
    font: inherit; text-align: right; border: 0; outline: 0; color: var(--ink); min-width: 0; flex: 1;
    -webkit-user-select: text; user-select: text;
  }
  .field input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--grad-a); }
  .sheet .row-btn { width: 100%; text-align: left; padding: 14px 0; border-bottom: 1px solid #eef0f6; }
  .sheet .hint { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 14px 0 0; }

  #nobt {
    display: none;
    margin: 12px 16px 0;
    padding: 12px 14px;
    border-radius: 12px;
    background: #fff4f2;
    color: #8a3a32;
    font-size: 14px;
    line-height: 1.5;
  }
  #nobt.show { display: block; }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="설정">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
        <circle cx="5" cy="7" r=".6" fill="#fff"/><circle cx="5" cy="14" r=".6" fill="#fff"/><circle cx="5" cy="21" r=".6" fill="#fff"/>
        <path d="M10 7h14M10 14h14M10 21h14"/>
      </svg>
    </button>
    <h1>I/O</h1>
    <button class="icon-btn" id="phoneBtn" aria-label="기기 연결">
      <svg width="28" height="30" viewBox="0 0 28 30" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
        <rect x="5" y="6" width="13" height="22" rx="3"/>
        <path d="M10 24.5h3"/>
        <circle cx="20" cy="7" r="6.5" fill="#fff" stroke="none"/>
        <path d="M20 5v.2M20 7.2v3" stroke="#7f9be9" stroke-width="1.8"/>
      </svg>
    </button>
  </div>
  <div class="device">
    <button class="device-badge" id="badge" aria-label="기기 연결">
      <svg width="28" height="41" viewBox="0 0 34 50" fill="none">
        <rect x="2" y="2" width="30" height="46" rx="9" fill="#fff" stroke="#e7e9f3" stroke-width="2"/>
        <path d="M5 25h24" stroke="#d8dbe8" stroke-width="1.5"/>
        <rect x="6" y="6" width="22" height="17" rx="6" fill="#f3f4f9"/>
        <rect x="14" y="40" width="6" height="2.4" rx="1.2" fill="#d8dbe8"/>
      </svg>
    </button>
    <div id="devName">내 스위처</div>
    <div id="devSub">연결 안 됨 · 눌러서 연결</div>
  </div>
</header>

<div id="nobt">이 브라우저는 블루투스를 지원하지 않습니다. 아이폰에서는 App Store의 <b>Bluefy</b> 앱을 설치하고, Bluefy에서 이 주소를 열어주세요.</div>

<main>
  <div class="pill" data-sw="1">
    <div class="pill-inner">
      <button class="side off" data-act="off" aria-label="스위치 1 끄기">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#5b6078" stroke-width="1.6" stroke-linejoin="round">
          <path d="M21.5 6.5A11 11 0 1 0 27.5 22 9 9 0 0 1 21.5 6.5z"/>
        </svg>
      </button>
      <span class="divider"></span>
      <button class="side on" data-act="on" aria-label="스위치 1 켜기">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="#5b6078" stroke-width="1.6" stroke-linecap="round">
          <circle cx="19" cy="19" r="7"/>
          <path d="M19 4v4M19 30v4M4 19h4M30 19h4M8.4 8.4l2.8 2.8M26.8 26.8l2.8 2.8M8.4 29.6l2.8-2.8M26.8 11.2l2.8-2.8"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="pill" data-sw="2">
    <div class="pill-inner">
      <button class="side off" data-act="off" aria-label="스위치 2 끄기">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#5b6078" stroke-width="1.6" stroke-linejoin="round">
          <path d="M21.5 6.5A11 11 0 1 0 27.5 22 9 9 0 0 1 21.5 6.5z"/>
        </svg>
      </button>
      <span class="divider"></span>
      <button class="side on" data-act="on" aria-label="스위치 2 켜기">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="#5b6078" stroke-width="1.6" stroke-linecap="round">
          <circle cx="19" cy="19" r="7"/>
          <path d="M19 4v4M19 30v4M4 19h4M30 19h4M8.4 8.4l2.8 2.8M26.8 26.8l2.8 2.8M8.4 29.6l2.8-2.8M26.8 11.2l2.8-2.8"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>
</main>

<nav>
  <button class="nav-btn" id="navConnect">
    <span class="nav-circle">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#5b6078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 9l11 10-5.5 5V4L19 9 8 19"/>
      </svg>
    </span>
    <span>기기 연결</span>
  </button>
  <button class="nav-btn" id="navInvert">
    <span class="nav-circle">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#5b6078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 10h17l-4-4M23 18H6l4 4"/>
      </svg>
    </span>
    <span>반전</span>
  </button>
  <button class="nav-btn" id="navSettings">
    <span class="nav-circle">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#5b6078" stroke-width="1.6" stroke-linecap="round">
        <path d="M5 8h18M5 14h18M5 20h18"/>
        <rect x="8" y="6" width="4" height="4" rx="1" fill="#fff"/>
        <rect x="16" y="12" width="4" height="4" rx="1" fill="#fff"/>
        <rect x="10" y="18" width="4" height="4" rx="1" fill="#fff"/>
      </svg>
    </span>
    <span>설정</span>
  </button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="설정">
  <div class="grabber"></div>
  <h2>설정</h2>
  <label class="field">기기 이름 <input type="text" id="nameInput" maxlength="20" placeholder="예: 안방"></label>
  <label class="field">ON/OFF 반전 <input type="checkbox" id="invert"></label>
  <button class="row-btn" id="pickOther">다른 기기 선택</button>
  <button class="row-btn" id="scanAll">기기가 안 보이면: 주변 모든 기기 보기</button>
  <p class="hint">반전은 스위처를 거꾸로 붙여서 ON/OFF가 반대로 동작할 때 켜세요.<br>
    지금 연결된 기기: <span id="sheetDev">없음</span><br>
    쓰기 방식: <span id="sheetMode">-</span></p>
</div>

<script>
  // 안드로이드 앱(lib/main.dart)과 같은 값
  const SERVICE_UUID = '0000150b-0000-1000-8000-00805f9b34fb';
  const CHAR_UUID = '000015ba-0000-1000-8000-00805f9b34fb';
  const KEYS = {
    1: { on: 0x00, off: 0x01 },
    2: { on: 0x05, off: 0x03 },
  };

  const $ = (id) => document.getElementById(id);
  let device = null;
  let characteristic = null;
  let busy = false;

  function load(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* 저장 못 해도 동작에는 지장 없음 */ }
  }

  function toast(msg, kind) {
    $('toast').textContent = msg;
    $('toast').className = kind || '';
  }

  function render(state) {
    const connected = !!(device && device.gatt.connected);
    $('badge').classList.toggle('busy', state === 'busy');
    $('devName').textContent = load('displayName') || '내 스위처';
    $('devSub').textContent =
      state === 'busy' ? '연결 중…'
      : connected ? '연결됨'
      : device ? '대기 중 · 버튼을 누르면 연결'
      : '연결 안 됨 · 눌러서 연결';
    $('sheetDev').textContent = device ? (device.name || '이름 없는 기기') : '없음';
    $('sheetMode').textContent = !characteristic ? '-' : writeMode(characteristic) === 'noResponse' ? '응답 없음' : '응답 받음';
    $('navInvert').classList.toggle('on', $('invert').checked);
    document.querySelectorAll('.pill').forEach((p) => {
      const last = load('last' + p.dataset.sw);
      p.querySelector('.off').classList.toggle('active', last === 'off');
      p.querySelector('.on').classList.toggle('active', last === 'on');
    });
    document.querySelectorAll('main button, nav button, .sheet button').forEach((b) => { b.disabled = busy; });
  }

  function watchDisconnect(d) {
    d.addEventListener('gattserverdisconnected', () => {
      characteristic = null;
      if (!busy) render();
    });
  }

  async function pickDevice(acceptAll) {
    const opts = acceptAll
      ? { acceptAllDevices: true, optionalServices: [SERVICE_UUID] }
      : { filters: [{ namePrefix: 'SWITCHER_M' }], optionalServices: [SERVICE_UUID] };
    device = await navigator.bluetooth.requestDevice(opts);
    characteristic = null;
    watchDisconnect(device);
    save('lastName', device.name || '');
  }

  // 실패했을 때 어느 단계였는지 보여주기 위함
  let step = '';

  async function ensureCharacteristic() {
    if (characteristic && device.gatt.connected) return characteristic;
    step = '연결';
    const server = await device.gatt.connect();
    step = '서비스 찾기';
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);
    return characteristic;
  }

  function writeMode(ch) {
    const p = (ch && ch.properties) || {};
    if (p.writeWithoutResponse && ch.writeValueWithoutResponse) return 'noResponse';
    return 'response';
  }

  async function writeByte(byte) {
    const data = new Uint8Array([byte]);
    const ch = await ensureCharacteristic();
    step = '쓰기';
    // 아이폰(Bluefy)에서는 응답 받는 쓰기가 기기에 전달돼 동작한 뒤에도 오류(코드 2)를
    // 돌려주는 경우가 있어서, 기기가 지원하면 응답 없는 쓰기를 쓴다.
    if (writeMode(ch) === 'noResponse') {
      await ch.writeValueWithoutResponse(data);
      return;
    }
    if (ch.writeValueWithResponse) await ch.writeValueWithResponse(data);
    else await ch.writeValue(data);
  }

  function errText(e) {
    if (e === null || e === undefined) return '알 수 없는 오류';
    if (typeof e !== 'object') return '코드 ' + e;
    const parts = [e.name, e.code !== undefined ? '코드 ' + e.code : '', e.message].filter(Boolean);
    return parts.length ? parts.join(' / ') : String(e);
  }

  async function run(fn) {
    if (busy) return;
    busy = true;
    step = '';
    render('busy');
    try {
      await fn();
    } catch (e) {
      if (e && e.name === 'NotFoundError') toast('기기 선택이 취소되었습니다.');
      else toast('실패' + (step ? ' (' + step + ' 단계)' : '') + ': ' + errText(e), 'err');
    } finally {
      busy = false;
      render();
    }
  }

  async function connect(acceptAll) {
    await pickDevice(acceptAll);
    await ensureCharacteristic();
    toast('연결됨', 'ok');
  }

  async function toggle(sw, act) {
    if (!device) await pickDevice(false);
    const sent = $('invert').checked ? (act === 'on' ? 'off' : 'on') : act;
    let lastErr;
    // 안드로이드 앱처럼 최대 3번 재시도
    for (let i = 0; i < 3; i++) {
      try {
        await writeByte(KEYS[sw][sent]);
        save('last' + sw, act);
        toast('스위치 ' + sw + ' ' + act.toUpperCase() + ' 완료', 'ok');
        return;
      } catch (e) {
        lastErr = e;
        characteristic = null;
        await new Promise((r) => setTimeout(r, 500));
      }
    }
    throw lastErr;
  }

  // 예전에 허용한 기기를 선택창 없이 다시 씀 (getDevices를 지원하는 브라우저만)
  async function restoreDevice() {
    if (!navigator.bluetooth.getDevices) return;
    try {
      const list = await navigator.bluetooth.getDevices();
      const lastName = load('lastName');
      const found = list.find((d) => d.name && d.name === lastName) || list[0];
      if (found) {
        device = found;
        watchDisconnect(device);
        render();
      }
    } catch (e) { /* 지원 안 하면 무시 */ }
  }

  function openSheet(open) {
    document.body.classList.toggle('sheet-open', open);
    if (open) $('nameInput').value = load('displayName') || '';
  }

  $('invert').checked = load('invert') === '1';
  $('invert').addEventListener('change', () => { save('invert', $('invert').checked ? '1' : '0'); render(); });
  $('navInvert').addEventListener('click', () => {
    $('invert').checked = !$('invert').checked;
    save('invert', $('invert').checked ? '1' : '0');
    toast($('invert').checked ? 'ON/OFF 반전 켜짐' : 'ON/OFF 반전 꺼짐');
    render();
  });
  $('nameInput').addEventListener('input', () => { save('displayName', $('nameInput').value.trim()); render(); });
  $('menuBtn').addEventListener('click', () => openSheet(true));
  $('navSettings').addEventListener('click', () => openSheet(true));
  $('sheetBg').addEventListener('click', () => openSheet(false));

  if (!navigator.bluetooth) {
    $('nobt').classList.add('show');
    render();
    document.querySelectorAll('main button, #navConnect, #badge, #phoneBtn, #pickOther, #scanAll').forEach((b) => { b.disabled = true; });
  } else {
    const connectTap = () => run(() => connect(false));
    $('navConnect').addEventListener('click', connectTap);
    $('badge').addEventListener('click', connectTap);
    $('phoneBtn').addEventListener('click', connectTap);
    $('pickOther').addEventListener('click', () => { openSheet(false); run(() => connect(false)); });
    $('scanAll').addEventListener('click', () => { openSheet(false); run(() => connect(true)); });
    document.querySelectorAll('.pill').forEach((p) => {
      p.querySelectorAll('.side').forEach((b) => {
        b.addEventListener('click', () => run(() => toggle(Number(p.dataset.sw), b.dataset.act)));
      });
    });
    render();
    restoreDevice();
  }
</script>
</body>
</html>
